<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini Chatbot</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1a1a2e;
      padding: 16px 24px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #7c83fd;
      border-bottom: 1px solid #2a2a3e;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .left { display: flex; align-items: center; gap: 12px; }

    #hamburger {
      background: none;
      border: none;
      color: #7c83fd;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    #hamburger:hover { color: #a0a8ff; }

    .account-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: 1px solid #3a3a5e;
      border-radius: 24px;
      padding: 5px 14px 5px 5px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
    }
    .account-btn:hover { background: #2a2a3e; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #7c83fd;
      color: #fff;
      font-size: 0.78rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .account-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .account-info .acc-label { font-size: 0.7rem; color: #888; line-height: 1; }
    .account-info .acc-email { font-size: 0.82rem; color: #e0e0e0; line-height: 1.4; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .three-dots {
      background: none;
      border: none;
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 50%;
      line-height: 1;
      transition: background 0.2s, color 0.2s;
    }
    .three-dots:hover { background: #2a2a3e; color: #e0e0e0; }

    .account-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #account-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #1e1e2e;
      border: 1px solid #2a2a3e;
      border-radius: 12px;
      min-width: 200px;
      z-index: 200;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    #account-menu.open { display: block; }

    #account-menu a, #account-menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 0.9rem;
      text-decoration: none;
      background: none;
      border: none;
      border-radius: 0;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    #account-menu a:hover, #account-menu button:hover { background: #2a2a3e; color: #7c83fd; }
    #account-menu .menu-divider { border: none; border-top: 1px solid #2a2a3e; margin: 4px 0; }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .user {
      background: #7c83fd;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #1e1e2e;
      color: #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .bot p { margin-bottom: 8px; }
    .bot p:last-child { margin-bottom: 0; }
    .bot ul, .bot ol { padding-left: 20px; margin-bottom: 8px; }
    .bot li { margin-bottom: 4px; }
    .bot strong { color: #a0a8ff; }
    .bot h1, .bot h2, .bot h3 { color: #a0a8ff; margin: 10px 0 6px; }
    .bot code {
      background: #0f0f1a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.88rem;
      color: #f8c555;
    }
    .bot pre {
      background: #0f0f1a;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bot pre code { background: none; padding: 0; color: #f8c555; }

    /* Structured response blocks */
    .resp-block {
      width: 75%;
      align-self: flex-start;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.93rem;
      line-height: 1.7;
    }
    .resp-block .block-label {
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      opacity: 0.7;
    }
    .theory-block  { background: #1a1f3a; border-left: 3px solid #7c83fd; color: #c8ccff; }
    .theory-block .block-label { color: #7c83fd; }
    .explain-block { background: #1a2a1a; border-left: 3px solid #4caf7d; color: #b8e6c8; }
    .explain-block .block-label { color: #4caf7d; }
    .code-block-wrap { background: #0d0d1a; border-left: 3px solid #f8c555; border-radius: 12px; overflow: hidden; width: 75%; align-self: flex-start; }
    .code-block-wrap .code-header {
      background: #1a1a2e;
      padding: 6px 14px;
      font-size: 0.75rem;
      color: #f8c555;
      font-family: monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid #2a2a3e;
    }
    .code-block-wrap pre {
      margin: 0;
      padding: 16px;
      overflow-x: auto;
      background: #0d0d1a;
    }
    .code-block-wrap pre code {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      color: #f8c555;
      line-height: 1.7;
      white-space: pre;
    }

    .typing {
      background: #1e1e2e;
      color: #888;
      align-self: flex-start;
      padding: 12px 16px;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      font-style: italic;
    }

    #input-area {
      display: flex;
      padding: 16px 24px;
      gap: 10px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a3e;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid #3a3a5e;
      background: #0f0f1a;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
    }
    #user-input:focus { border-color: #7c83fd; }

    button {
      padding: 12px 20px;
      background: #7c83fd;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    button:hover { background: #5c63dd; }
    button:disabled { background: #444; cursor: not-allowed; }

    /* Sidebar */
    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
    }
    #sidebar-overlay.open { display: block; }

    #sidebar-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
    }

    #sidebar {
      position: absolute;
      top: 0; left: 0;
      width: 260px;
      height: 100%;
      background: #1a1a2e;
      border-right: 1px solid #2a2a3e;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    #sidebar h2 {
      color: #7c83fd;
      font-size: 1rem;
      padding: 20px;
      border-bottom: 1px solid #2a2a3e;
    }

    .nav-link {
      color: #e0e0e0;
      text-decoration: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
      border-radius: 0;
      transition: background 0.15s;
    }
    .nav-link:hover { background: #2a2a3e; color: #7c83fd; }

    /* History panel */
    #history-panel {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    #history-panel.open { display: flex; }

    #history-panel h3 {
      color: #7c83fd;
      font-size: 0.9rem;
      padding: 12px 20px 8px;
      border-bottom: 1px solid #2a2a3e;
    }

    #history-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.4;
      max-width: 100%;
      word-break: break-word;
    }
    .history-item.user { background: #7c83fd22; color: #a0a8ff; align-self: flex-end; text-align: right; }
    .history-item.bot  { background: #1e1e2e; color: #ccc; align-self: flex-start; }

    .history-ts {
      font-size: 0.72rem;
      color: #555;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <header>
    <div class="left">
      <button id="hamburger" onclick="toggleSidebar()">&#9776;</button>
      🤖 Gemini Chatbot
    </div>
    <div class="account-wrapper">
      <div class="account-btn" style="cursor:default;">
        <div class="avatar" id="avatar-initials"></div>
        <div class="account-info">
          <span class="acc-label">Account</span>
          <span class="acc-email">{{ email }}</span>
        </div>
      </div>
      <button class="three-dots" onclick="toggleAccountMenu(event)">&#8942;</button>
      <div id="account-menu">
        <a href="/logout">🚪 Logout</a>
        <hr class="menu-divider">
        <a href="/login">🔄 Login with another mail</a>
        <hr class="menu-divider">
        <button onclick="triggerProfileUpload()">➕ Add profile</button>
        <button onclick="triggerProfileUpload()">🖼️ Change profile</button>
      </div>
    </div>
    <input type="file" id="profile-input" accept="image/*" style="display:none" onchange="uploadProfile(this)">
  </header>

  <div id="sidebar-overlay">
    <div id="sidebar-backdrop" onclick="toggleSidebar()"></div>
    <nav id="sidebar">
      <h2>Menu</h2>
      <button class="nav-link" onclick="toggleSidebar()">🧪 Playground</button>
      <button class="nav-link" onclick="toggleSidebar()">📱 My Apps</button>
      <button class="nav-link" onclick="openHistory()">🕒 History</button>
      <button class="nav-link" onclick="toggleSidebar()">📊 Dashboard</button>

      <div id="history-panel">
        <h3>Chat History</h3>
        <div id="history-list"></div>
      </div>
    </nav>
  </div>

  <div id="chat-box">
    <div class="message bot">Hi! I'm powered by Google Gemini. Ask me anything! 👋</div>
  </div>

  <div id="input-area">
    <input id="user-input" type="text" placeholder="Type a message..." autofocus />
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("user-input");
    const btn = document.getElementById("send-btn");

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    // Set avatar — show profile pic if exists, else initial
    const email = "{{ email }}";
    const avatarEl = document.getElementById("avatar-initials");
    const img = new Image();
    img.onload = () => { avatarEl.innerHTML = ""; avatarEl.appendChild(img); };
    img.onerror = () => { avatarEl.textContent = email[0].toUpperCase(); };
    img.src = "/profile-pic?t=" + Date.now();
    img.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:50%;";

    function triggerProfileUpload() {
      document.getElementById("account-menu").classList.remove("open");
      document.getElementById("profile-input").click();
    }

    async function uploadProfile(input) {
      const file = input.files[0];
      if (!file) return;
      const form = new FormData();
      form.append("profile", file);
      const res = await fetch("/upload-profile", { method: "POST", body: form });
      const data = await res.json();
      if (data.ok) {
        const reader = new FileReader();
        reader.onload = e => {
          avatarEl.innerHTML = "";
          const newImg = document.createElement("img");
          newImg.src = e.target.result;
          newImg.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:50%;";
          avatarEl.appendChild(newImg);
        };
        reader.readAsDataURL(file);
      }
      input.value = "";
    }

    function toggleAccountMenu(e) {
      e.stopPropagation();
      document.getElementById("account-menu").classList.toggle("open");
    }

    document.addEventListener("click", () => {
      document.getElementById("account-menu").classList.remove("open");
    });

    function toggleSidebar() {
      document.getElementById("sidebar-overlay").classList.toggle("open");
      document.getElementById("history-panel").classList.remove("open");
    }

    async function openHistory() {
      document.getElementById("history-panel").classList.add("open");
      const list = document.getElementById("history-list");
      list.innerHTML = "<p style='color:#555;padding:8px'>Loading...</p>";

      const res = await fetch("/history");
      const data = await res.json();
      list.innerHTML = "";

      if (data.length === 0) {
        list.innerHTML = "<p style='color:#555;padding:8px'>No history yet.</p>";
        return;
      }

      data.forEach(item => {
        const div = document.createElement("div");
        div.className = `history-item ${item.role}`;
        div.textContent = item.message;
        const ts = document.createElement("div");
        ts.className = "history-ts";
        ts.textContent = new Date(item.timestamp).toLocaleString();
        div.appendChild(ts);
        list.appendChild(div);
      });

      list.scrollTop = list.scrollHeight;
    }

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      if (role === "bot") {
        div.innerHTML = marked.parse(text);
      } else {
        div.textContent = text;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      btn.disabled = true;

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "Gemini is typing...";
      chatBox.appendChild(typing);
      chatBox.scrollTop = chatBox.scrollHeight;

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });

      const data = await res.json();
      chatBox.removeChild(typing);
      renderStructured(data);
      btn.disabled = false;
      input.focus();
    }

    function renderStructured(data) {
      if (data.theory) {
        const b = document.createElement("div");
        b.className = "resp-block theory-block";
        b.innerHTML = `<div class="block-label">📘 Theory</div>${escapeHtml(data.theory)}`;
        chatBox.appendChild(b);
      }
      if (data.code) {
        const wrap = document.createElement("div");
        wrap.className = "code-block-wrap";
        const lang = data.code_language || "code";
        wrap.innerHTML = `<div class="code-header">💻 ${lang}</div><pre><code>${escapeHtml(data.code)}</code></pre>`;
        chatBox.appendChild(wrap);
      }
      if (data.explanation) {
        const b = document.createElement("div");
        b.className = "resp-block explain-block";
        b.innerHTML = `<div class="block-label">📝 Explanation</div>${escapeHtml(data.explanation).replace(/\n/g, "<br>")}`;
        chatBox.appendChild(b);
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
  </script>

</body>
</html>
