<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – Gemini Chatbot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #1e1e2e;
      padding: 36px 32px;
      border-radius: 16px;
      width: 360px;
      border: 1px solid #2a2a3e;
    }
    h2 { color: #7c83fd; margin-bottom: 24px; font-size: 1.4rem; }
    input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 14px;
      border-radius: 24px;
      border: 1px solid #3a3a5e;
      background: #0f0f1a;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: #7c83fd; }
    button {
      width: 100%;
      padding: 12px;
      background: #7c83fd;
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #5c63dd; }
    .error { color: #ff6b6b; font-size: 0.88rem; margin-bottom: 12px; }
    .link { text-align: center; margin-top: 16px; font-size: 0.88rem; color: #888; }
    .link a { color: #7c83fd; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🤖 Register</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
      <input type="email" name="email" placeholder="Email address" required autofocus/>
      <input type="password" name="password" placeholder="Password" required/>
      <button type="submit">Register</button>
    </form>
    <p class="link">Already have an account? <a href="/login">Login</a></p>
  </div>
</body>
</html>
